name: Check preset sources
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evidence/presets/**'
      - 'scripts/check-preset-sources.mjs'
      - '.github/workflows/preset-source-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compare official sources with reviewed baseline
        run: node scripts/check-preset-sources.mjs --report preset-source-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preset-source-report
          path: preset-source-report.json
